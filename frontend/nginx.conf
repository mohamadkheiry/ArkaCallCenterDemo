server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker service IPs may change when only the API container is recreated.
    # Resolve the service name at request time so nginx never keeps a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # SPA fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # پراکسی API و health به سرویس بک‌اند
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 300m;   # آپلود ویدیوی آموزشی
        proxy_request_buffering off;
    }
    location /health {
        proxy_pass $api_upstream;
    }

    # کش دارایی‌های استاتیک
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
